apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kube-prom-stack
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: ExternalArtifact
    name: observability
  path: "./observability/kube-prom-stack"
  prune: true
  wait: true
  timeout: 5m
  dependsOn:
    - name: metrics-server
    - name: openebs-localpv-zfs-configs
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: headlamp
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: ExternalArtifact
    name: observability
  path: "./observability/headlamp"
  prune: true
  wait: true
  timeout: 5m
  dependsOn:
    - name: metrics-server
    - name: openebs-localpv-zfs-configs
