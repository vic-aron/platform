apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tenant-1
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: ExternalArtifact
    name: tenants
  path: "./tenants/tenant-1"
  prune: true
  wait: true
  timeout: 5m
  dependsOn:
    - name: capi-configs
    - name: cdi-storageprofiles
    - name: kubevirt
