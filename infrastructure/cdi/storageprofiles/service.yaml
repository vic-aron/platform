apiVersion: v1
kind: Service
metadata:
  name: cdi-uploadproxy-lb
  namespace: cdi
  annotations:
    metallb.io/loadBalancerIPs: 10.212.212.87
spec:
  type: LoadBalancer
  selector:
    cdi.kubevirt.io: cdi-uploadproxy
  ports:
    - name: https
      port: 443
      targetPort: 8443
      protocol: TCP
