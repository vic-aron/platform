apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-dns
  namespace: platform
data:
  Corefile: |
    .:53 {
      errors
      health :8080
      ready :8181

      hosts {
        10.212.212.77  grafana.home.arpa
        10.212.212.60  distribution.home.arpa
        10.212.212.78  headlamp.home.arpa

        ttl 300
        reload 5s
        fallthrough
      }

      forward . 10.212.212.254
      cache 30
      loop
      reload
      loadbalance
    }
