apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cluster-autoscaler
  namespace: kube-system
spec:
  interval: 15m
  timeout: 5m
  chart:
    spec:
      chart: cluster-autoscaler
      version: "9.59.x"
      sourceRef:
        kind: HelmRepository
        name: cluster-autoscaler
        namespace: kube-system
  releaseName: cluster-autoscaler
  install:
    crds: Create
    createNamespace: false
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  test:
    enable: true
  driftDetection:
    mode: enabled
  valuesFrom:
    - kind: ConfigMap
      name: cluster-autoscaler-values
      valuesKey: values.yaml
      optional: false
