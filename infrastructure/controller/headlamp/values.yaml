apiVersion: v1
kind: ConfigMap
metadata:
  name: headlamp-values
  namespace: kube-system
  labels:
    reconcile.fluxcd.io/watch: Enabled
data:
  values.yaml: |
    config:
      watchPlugins: true

    pluginsManager:
      enabled: true
      configContent: |
        plugins:

          - name: headlamp_flux
            source: https://artifacthub.io/packages/headlamp/headlamp-plugins/headlamp_flux
            version: 0.7.0

          - name: headlamp_cert-manager
            source: https://artifacthub.io/packages/headlamp/headlamp-plugins/headlamp_cert-manager
            version: 0.1.1

          - name: headlamp_cluster-api
            source: https://artifacthub.io/packages/headlamp/headlamp-plugins/headlamp_cluster-api
            version: 0.2.0-beta

          - name: headlamp_kubevirt
            source: https://artifacthub.io/packages/headlamp/headlamp-kubevirt/headlamp_kubevirt
            version: 0.3.1

        installOptions:
          parallel: true
          maxConcurrent: 2
