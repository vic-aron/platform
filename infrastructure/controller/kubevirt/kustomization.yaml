apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs:
      app.kubernetes.io/name: kubevirt
      app.kubernetes.io/component: virtualization
      app.kubernetes.io/part-of: platform
      app.kubernetes.io/managed-by: flux
      platform.shinoval.work/cluster: management
      platform.shinoval.work/environment: production
    includeSelectors: false
    includeTemplates: false
resources:
  - kubevirt-operator.yaml
  - kubevirt-network-policies.yaml
patches:
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
    target:
      group: apps
      version: v1
      kind: Deployment
      name: virt-operator
      labelSelector: "kubevirt.io=virt-operator"
