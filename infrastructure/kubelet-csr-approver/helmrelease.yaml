apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kubelet-csr-approver
  namespace: kube-system
spec:
  interval: 15m
  timeout: 5m
  chart:
    spec:
      chart: kubelet-csr-approver
      version: "1.2.x"
      sourceRef:
        kind: HelmRepository
        name: kubelet-csr-approver
        namespace: kube-system
  releaseName: kubelet-csr-approver
  targetNamespace: kube-system
  install:
    createNamespace: true
    crds: Create
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  test:
    enable: true
  driftDetection:
    mode: enabled
  valuesFrom:
    - kind: ConfigMap
      name: kubelet-csr-approver-values
      valuesKey: values.yaml
      optional: false
