apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: reloader
  namespace: reloader
spec:
  interval: 15m
  timeout: 5m
  chart:
    spec:
      chart: reloader
      version: "2.2.x"
      sourceRef:
        kind: HelmRepository
        name: reloader
        namespace: reloader
  releaseName: reloader
  targetNamespace: reloader
  install:
    createNamespace: true
    crds: Create
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  test:
    enable: true
  driftDetection:
    mode: enabled
  valuesFrom:
    - kind: ConfigMap
      name: reloader-values
      valuesKey: values.yaml
      optional: false
