apiVersion: v1
kind: Service
metadata:
  name: headlamp
  namespace: kube-system
  annotations:
    metallb.io/loadBalancerIPs: 10.212.212.78
spec:
  type: LoadBalancer
  externalTrafficPolicy: Cluster
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 3600
  selector:
    cdi.kubevirt.io: cdi-uploadproxy
  ports:
    - name: https
      port: 443
      targetPort: 8443
      protocol: TCP
