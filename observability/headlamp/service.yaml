apiVersion: v1
kind: Service
metadata:
  name: headlamp-lb
  namespace: kube-system
  annotations:
    metallb.io/loadBalancerIPs: 10.212.212.78
spec:
  type: LoadBalancer
  externalTrafficPolicy: Cluster
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 3600
  selector:
    app.kubernetes.io/name: headlamp
  ports:
    - name: https
      port: 80
      targetPort: 4466
      protocol: TCP
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: headlamp
  namespace: kube-system
spec:
  secretName: headlamp-tls
  issuerRef:
    name: platform-ca-issuer
    kind: ClusterIssuer
    group: cert-manager.io
  dnsNames:
    - headlamp.home.arpa
  privateKey:
    algorithm: ECDSA
    size: 256
  usages:
    - digital signature
    - key encipherment
    - server auth
