apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: monitoring
  annotations:
    metallb.io/loadBalancerIPs: 10.212.212.77
spec:
  type: LoadBalancer
  externalTrafficPolicy: Cluster
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 3600
  selector:
    app.kubernetes.io/name: grafana
  ports:
    - name: https
      port: 80
      targetPort: 3000
      protocol: TCP
