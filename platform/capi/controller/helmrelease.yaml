apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: capi-operator
  namespace: capi-operator-system
spec:
  interval: 15m
  timeout: 5m
  chart:
    spec:
      chart: capi-operator
      version: "1.14.2"
      sourceRef:
        kind: HelmRepository
        name: capi-operator
        namespace: capi-system
  releaseName: capi-operator
  targetNamespace: capi-operator-system
  install:
    crds: Create
    createNamespace: true
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  test:
    enable: true
  driftDetection:
    mode: enabled
