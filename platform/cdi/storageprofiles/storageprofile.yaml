apiVersion: cdi.kubevirt.io/v1beta1
kind: StorageProfile
metadata:
  name: openebs-localpv-zfs-block-delete
spec:
  claimPropertySets:
    - accessModes:
        - ReadWriteOnce
      volumeMode: Block
  snapshotClass: openebs-localpv-zfs-snapclass
  cloneStrategy: snapshot
---
apiVersion: cdi.kubevirt.io/v1beta1
kind: StorageProfile
metadata:
  name: openebs-localpv-zfs-delete-128k
spec:
  claimPropertySets:
    - accessModes:
        - ReadWriteOnce
      volumeMode: Filesystem
  snapshotClass: openebs-localpv-zfs-snapclass
  cloneStrategy: snapshot
