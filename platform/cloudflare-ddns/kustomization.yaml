apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: platform
labels:
  - pairs:
      app.kubernetes.io/name: cloudflare-ddns
      app.kubernetes.io/component: external-dns
      app.kubernetes.io/part-of: infrastructure
      app.kubernetes.io/managed-by: flux
      platform.shinoval.work/cluster: management
      platform.shinoval.work/environment: production
    includeSelectors: false
    includeTemplates: false
resources:
  - deployment.yaml
  - secret.yaml
