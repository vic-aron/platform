apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-dns
  namespace: platform
  labels:
    app.kubernetes.io/name: platform-dns
    app.kubernetes.io/instance: platform-dns
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: platform-dns
      app.kubernetes.io/instance: platform-dns
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: platform-dns
        app.kubernetes.io/instance: platform-dns
    spec:
      terminationGracePeriodSeconds: 10
      securityContext:
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: coredns
          image: coredns/coredns:1.13.1
          imagePullPolicy: IfNotPresent
          args:
            - -conf
            - /etc/coredns/Corefile

          ports:
            - name: dns-udp
              containerPort: 53
              protocol: UDP
            - name: dns-tcp
              containerPort: 53
              protocol: TCP
            - name: health
              containerPort: 8080
              protocol: TCP
            - name: ready
              containerPort: 8181
              protocol: TCP

          livenessProbe:
            httpGet:
              path: /health
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /ready
              port: ready
            initialDelaySeconds: 5
            periodSeconds: 10

          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi

          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
              add:
                - NET_BIND_SERVICE

          volumeMounts:
            - name: config
              mountPath: /etc/coredns/Corefile
              subPath: Corefile
              readOnly: true

      volumes:
        - name: config
          configMap:
            name: platform-dns
            items:
              - key: Corefile
                path: Corefile
