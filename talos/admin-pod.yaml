apiVersion: v1
kind: Pod
metadata:
  name: admin-pod
  namespace: kube-system
spec:
  nodeName: cp-0
  hostNetwork: true
  hostPID: true
  containers:
    - name: admin-pod
      image: ubuntu:26.04
      command:
        - /bin/bash
        - -c
        - |
          apt-get update
          apt-get install -y \
            zfsutils-linux \
            util-linux \
            fdisk \
            gdisk \
            parted \
            smartmontools \
            usbutils \
            dmidecode \
            sg3-utils \
            cryptsetup \
            lvm2 \
            mdadm \
            ethtool \
            iproute2 \
            kmod \
            udev \
            hdparm \
            nvme-cli \
            vim \
            less \
            procps \
            file \
            strace \
            lsscsi \
            pciutils \
            bash-completion
          exec sleep infinity
      securityContext:
        privileged: true
      volumeMounts:
        - name: dev
          mountPath: /dev
        - name: host-root
          mountPath: /host
        - name: udev
          mountPath: /run/udev
          readOnly: true
  volumes:
    - name: dev
      hostPath:
        path: /dev
    - name: host-root
      hostPath:
        path: /
    - name: udev
      hostPath:
        path: /run/udev
        type: Directory
