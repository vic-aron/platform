apiVersion: cluster.x-k8s.io/v1beta2
kind: Cluster
metadata:
  name: tenant-1
  namespace: tenant-1
spec:
  paused: false
  clusterNetwork:
    services:
      cidrBlocks:
        - "10.95.0.0/16"
    pods:
      cidrBlocks:
        - "10.243.0.0/16"
    serviceDomain: "cluster.local"
  topology:
    classRef:
      name:  clusterclass-v1
      namespace: tenant-1
    version: "1.36.0"
    controlPlane:
      replicas: 1
    workers:
      machineDeployments:
        - class: worker-medium-v1
          name: md-workers
          replicas: 2
