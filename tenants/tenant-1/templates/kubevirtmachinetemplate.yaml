apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
kind: KubevirtMachineTemplate
metadata:
  name: controlplane-v1
  namespace: tenant-1
spec:
  template:
    spec:
      virtualMachineBootstrapCheck:
        checkStrategy: ssh
      virtualMachineTemplate:
        spec:
          runStrategy: always
          dataVolumeTemplates:
            - metadata:
                name: os-volume
              spec:
                sourceRef:
                  kind: DataSource
                  name: kubeadm-image
                  namespace: tenant-1
                storage:
                  storageClassName: openebs-localpv-zfs-block-delete
                  accessModes:
                    - ReadWriteOnce
                  volumeMode: Block
                  resources:
                    requests:
                      storage: 20Gi
          template:
            spec:
              domain:
                clock:
                  timer: {}
                  utc: {}
                resources:
                  requests:
                    cpu: 2
                    memory: 5Gi
                cpu:
                  cores: 2
                  model: host-passthrough
                memory:
                  guest: 4Gi
                machine:
                  type: q35
                features:
                  smm:
                    enabled: false
                  kvm:
                    hidden: false
                firmware:
                  bootloader:
                    efi:
                      persistent: true
                      secureBoot: false
                devices:
                  autoattachVSOCK: true
                  networkInterfaceMultiqueue: true
                  autoattachSerialConsole: true
                  autoattachGraphicsDevice: false
                  autoattachMemBalloon: false
                  rng: {}
                  watchdog:
                    name: watchdog
                    i6300esb:
                      action: reset
                  interfaces:
                    - name: eth0
                      masquerade: {}
                  disks:
                    - name: os-disk
                      disk:
                        bus: virtio
                      serial: kubevirt-os
                      bootOrder: 1
              networks:
                - name: eth0
                  pod: {}
              volumes:
                - name: os-disk
                  dataVolume:
                    name: os-volume
---
