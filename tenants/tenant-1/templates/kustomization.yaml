apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: tenant-1
labels:
  - pairs:
      app.kubernetes.io/name: tenant-1
      app.kubernetes.io/component: tenants
      app.kubernetes.io/part-of: tenants
      app.kubernetes.io/managed-by: flux
      platform.shinoval.work/cluster: management
      platform.shinoval.work/environment: production
    includeSelectors: false
    includeTemplates: false
resources:
  - kubeadmconfigtemplate.yaml
  - kubeadmcontrolplanetemplate.yaml
  - kubevirtclustertemplate.yaml
  - machinedrainrule.yaml
  - helmchartproxy.yaml
  - kubevirtmachinetemplate.yaml
  - clusterclass.yaml
