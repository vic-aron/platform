apiVersion: v1
kind: Namespace
metadata:
  name: virtual-machines
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: virtual-machines
  namespace: virtual-machines
spec:
  hard:
    requests.cpu: "32"
    requests.memory: 64Gi
    requests.storage: 2Ti
    persistentvolumeclaims: "20"
    pods: "40"
    services: "20"
    count/virtualmachines.kubevirt.io: "20"
    count/datavolumes.cdi.kubevirt.io: "20"
